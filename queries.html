<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Queries | Beauty Of Beaches</title>
<meta name="description" content="Ask a question about beaches or the website.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="siteHeader"></div>

<section class="page-hero"><div class="container"><div class="breadcrumb">Home / Queries</div><span class="eyebrow">Need more information?</span><h1>Ask Us a Question</h1><p>Send us a question about a beach, destination or this website.</p></div></section>
<section class="section"><div class="container"><form class="form-card" data-local-form><div class="form-group"><label for="qName">Your name</label><input id="qName" name="name" required placeholder="Enter your name"></div><div class="form-group"><label for="qEmail">Email address</label><input id="qEmail" name="email" type="email" required placeholder="name@example.com"></div><div class="form-group"><label for="qTopic">Question topic</label><select id="qTopic" name="topic" required><option value="">Choose a topic</option><option>Beach information</option><option>Travel and access</option><option>Website support</option><option>Other</option></select></div><div class="form-group"><label for="qMessage">Your question</label><textarea id="qMessage" name="message" required placeholder="Write your question here…"></textarea></div><button class="btn-primary-custom" type="submit">Send Question</button><p class="notice" data-form-message aria-live="polite"></p><p class="notice">Demo note: this form does not send email. Connect a backend or form service for real submissions.</p></form></div></section>

<div id="siteFooter"></div>
<script src="js/common.js"></script>
</body></html>
