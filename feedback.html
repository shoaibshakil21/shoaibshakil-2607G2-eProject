<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feedback | Beauty Of Beaches</title>
<meta name="description" content="Share your feedback about the Beauty Of Beaches website.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="siteHeader"></div>

<section class="page-hero"><div class="container"><div class="breadcrumb">Home / Feedback</div><span class="eyebrow">Help us improve</span><h1>Share Your Feedback</h1><p>Your thoughts help us make this beach guide more useful and enjoyable.</p></div></section>
<section class="section soft"><div class="container"><form class="form-card" data-local-form><div class="form-group"><label for="fbName">Your name</label><input id="fbName" name="name" required placeholder="Enter your name"></div><div class="form-group"><label for="fbEmail">Email address</label><input id="fbEmail" name="email" type="email" required placeholder="name@example.com"></div><div class="form-group"><label for="fbRating">How would you rate our website?</label><select id="fbRating" name="rating" required><option value="">Select a rating</option><option>Excellent</option><option>Very Good</option><option>Good</option><option>Needs Improvement</option></select></div><div class="form-group"><label for="fbMessage">Your feedback</label><textarea id="fbMessage" name="message" required placeholder="Tell us what you think…"></textarea></div><button class="btn-primary-custom" type="submit">Submit Feedback</button><p class="notice" data-form-message aria-live="polite"></p><p class="notice">Demo note: this form displays a confirmation in your browser. A server is required to collect submissions online.</p></form></div></section>

<div id="siteFooter"></div>
<script src="js/common.js"></script>
</body></html>
